[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) in argument defaults is the standard FastAPI idiom

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]
